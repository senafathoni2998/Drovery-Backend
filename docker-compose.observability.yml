# Local observability stack (Prometheus + Grafana), provisioned with the Drovery
# dashboards + SLO alert rules. Profile-gated so the default `docker compose up`
# stays lean. Bring it up alongside the app stack:
#
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml \
#     --profile observability up -d
#
# Then: Prometheus http://localhost:9090 (targets + alerts), Alertmanager
# http://localhost:9093 (routing + silences), Grafana http://localhost:3001
# (admin/admin) → the provisioned Drovery dashboards.
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ['observability']
    depends_on:
      - alertmanager
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports:
      - '9090:9090'
    restart: unless-stopped

  # Routes what Prometheus fires. Ships with EMPTY receivers, which is valid: you get
  # grouping, inhibition and silences at :9093 out of the box, and delivery is a few
  # uncommented lines in observability/alertmanager.yml.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ['observability']
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    # No env vars: Alertmanager does not expand them in its config. Receivers are
    # configured by editing observability/alertmanager.yml (see the comments there).
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertdata:/alertmanager
    ports:
      - '9093:9093'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ['observability']
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - '3001:3000'
    restart: unless-stopped

volumes:
  promdata:
  grafanadata:
  alertdata:
