global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

# Where firing rules actually GO. Without this block the nine rules in alerts.yml
# evaluated and fired into the Prometheus UI and nowhere else — three of them are
# `severity: critical`, so the stack could detect an outage and page nobody.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # API tier — HTTP histogram/counter, WS gauges, default node/process metrics.
  - job_name: drovery-api
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['api:3000']
        labels: { tier: api }

  # Worker tier — the BullMQ queue-depth gauge (the KEDA autoscaler signal) +
  # default node/process metrics, served on the standalone metrics port.
  - job_name: drovery-worker
    metrics_path: /metrics
    static_configs:
      - targets: ['worker:9091']
        labels: { tier: worker }
